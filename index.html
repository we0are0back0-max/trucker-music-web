<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trucker Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; background-color: #000; background-image: url('https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; font-family: sans-serif; color: #fff; }

        .info-bar { position: absolute; top: 15px; width: 90%; left: 5%; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; z-index: 10; opacity: 0.9; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
        .support-btn { position: absolute; top: 40px; left: 5%; z-index: 10; }
        .support-btn a { color: #fff; font-size: 11px; font-weight: 700; text-decoration: none; opacity: 0.9; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }

        .quote-container { position: absolute; bottom: 250px; width: 90%; left: 5%; text-align: center; z-index: 10; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); padding: 0 10px; }

        .actions-container { position: absolute; top: 110px; left: 15px; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        .action-box { display: flex; flex-direction: column; align-items: center; width: 80px; }
        .action-img { width: 55px; height: 55px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); object-fit: cover; margin-bottom: 5px; }
        .action-label { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(5px); padding: 4px 6px; border-radius: 6px; font-size: 9px; text-align: center; font-weight: 600; width: 100%; }
        .action-label a { color: #fff; text-decoration: none; display: block; }

        .radio-buttons-container { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; display: flex; gap: 8px; z-index: 10; justify-content: center; }
        .radio-btn { flex: 1; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 12px; padding: 10px 6px; color: #fff; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .radio-btn:active { background: #fff; color: #000; }

        .player-wrapper { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; z-index: 10; }
        .player-card { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; padding: 12px 18px; }
        .top-section { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .cd-art { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(255,255,255,0.3); animation: spin 8s linear infinite; animation-play-state: paused; }
        .cd-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .song-details { flex: 1; overflow: hidden; }
        .song-title { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: 11px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .status-msg { font-size: 10px; color: #ffeb3b; font-weight: 600; margin-top: 2px; }

        .progress-container { width: 100%; margin-bottom: 8px; margin-top: 4px; }
        .progress-bar { -webkit-appearance: none; width: 100%; height: 3px; background: rgba(255, 255, 255, 0.3); outline: none; border-radius: 2px; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
        .time-stamps { display: flex; font-size: 9px; margin-top: 4px; color: #bbb; justify-content: space-between; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { background: none; border: none; cursor: pointer; color: #fff; opacity: 0.85; padding: 5px; }
        .play-pause-circle { width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #000; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .playlist-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); z-index: 100; display: none; flex-direction: column; padding: 20px; }
        .search-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; margin-bottom: 15px; }
        .song-list { flex: 1; overflow-y: auto; }
        .song-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
        .song-item.active { background: #333; }
        svg { fill: currentColor; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div id="clock">00:00</div>
        <div id="live-users">Live: 750</div>
    </div>
    
    <div class="support-btn">
        <a href="https://www.instagram.com/shiva_008i?igsi=MWFmc2VxanJ3NHJyNQ==" target="_blank">Support ID</a>
    </div>

    <div id="quote-container" class="quote-container">Loading...</div>

    <div class="actions-container">
        <div class="action-box">
            <img src="dhaba.jpg" class="action-img" alt="Dhaba" onerror="this.style.display='none'">
            <div class="action-label"><a href="https://www.google.com/maps/search/dhabas+near+me" target="_blank">नजदीकी चाय-पानी / Dhaba</a></div>
        </div>
        <div class="action-box">
            <img src="fule.jpg" class="action-img" alt="Fuel" onerror="this.style.display='none'">
            <div class="action-label"><a href="https://www.google.com/maps/search/diesel+pump+near+me" target="_blank">नजदीकी diesel Pump</a></div>
        </div>
    </div>

    <!-- Live Radio Buttons -->
    <div class="radio-buttons-container">
        <button class="radio-btn" id="btn-radio1">📻 सदाबहार रेडियो</button>
        <button class="radio-btn" id="btn-radio2">🎶 क्लासिक 80s-90s</button>
    </div>

    <div class="player-wrapper">
        <div class="player-card">
            <div class="top-section">
                <img id="cd-disc" class="cd-art" src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'" alt="CD">
                <div class="song-details">
                    <div class="song-title" id="song-name">Ready to Play</div>
                    <div class="artist-name" id="artist-name">Select Radio Channel</div>
                    <div class="status-msg" id="status-msg">Click Radio Button Above</div>
                </div>
            </div>
            
            <audio id="audio"></audio>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
            </div>
            <div class="controls-row">
                <button class="icon-btn" id="shuffle-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
                <button class="icon-btn" id="prev"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="play-pause-circle" id="play-btn">
                    <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="icon-btn" id="next"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="icon-btn" id="playlist-btn"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h11v2H4z"/></svg></button>
            </div>
        </div>
    </div>

    <div class="playlist-modal" id="playlist-modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>Playlist</h3><button class="icon-btn" id="close-playlist">✕</button></div>
        <input type="text" id="search-bar" class="search-input" placeholder="Search song...">
        <div class="song-list" id="song-list"></div>
    </div>

    <script src="data.js"></script>
    <script>
        const quotes = [
            "धीरे चल प्यारे, जीवन अनमोल है।",
            "धीरे चलोगे तो बार-बार मिलोगे, तेज चलोगे तो हरिद्वार मिलोगे।",
            "दम है तो क्रॉस कर, नहीं तो बर्दाश्त कर।",
            "वाहन चलाते समय सौंदर्य दर्शन ना करें वरना देव दर्शन हो जाएंगे।",
            "सावधानी हटी, सब्जी-पूड़ी बंटी।",
            "हवा से बातें करता है, जरा हट के चल।",
            "यह तूफान मेल से कम नहीं, और किसी में इतना दम नहीं।",
            "मां का आशीर्वाद है, यूं ही चलते रहेंगे।"
        ];

        let qIndex = 0;
        setInterval(() => { 
            document.getElementById('quote-container').innerText = quotes[qIndex]; 
            qIndex = (qIndex + 1) % quotes.length; 
        }, 12000);
        document.getElementById('quote-container').innerText = quotes[0];

        setInterval(() => { 
            document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); 
        }, 1000);

        let currentSongIndex = 0, isShuffle = false;
        const audio = document.getElementById('audio'), 
              playBtn = document.getElementById('play-btn'), 
              playIcon = document.getElementById('play-icon'), 
              pauseIcon = document.getElementById('pause-icon'), 
              progress = document.getElementById('progress'), 
              currentTimeEl = document.getElementById('current-time'), 
              durationEl = document.getElementById('duration'), 
              nextBtn = document.getElementById('next'), 
              prevBtn = document.getElementById('prev'), 
              shuffleBtn = document.getElementById('shuffle-btn'), 
              songNameEl = document.getElementById('song-name'), 
              artistNameEl = document.getElementById('artist-name'), 
              statusMsg = document.getElementById('status-msg'),
              cdDisc = document.getElementById('cd-disc');

        function setStatus(msg) {
            statusMsg.innerText = msg;
        }

        // Direct Working Streams (Strict HTTPS Standard Direct Streams)
        const URL_RADIO_1 = 'https://stream.zeno.fm/f3wvbb754wzuv';
        const URL_RADIO_2 = 'https://stream.zeno.fm/601r2f8e138uv';

        audio.onplaying = function() {
            setStatus('▶ Playing Now');
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            cdDisc.classList.add('playing');
        };

        audio.onpause = function() {
            setStatus('Paused');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            cdDisc.classList.remove('playing');
        };

        audio.onerror = function() {
            setStatus('⚠️ Stream Error - Tap Again');
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            cdDisc.classList.remove('playing');
        };

        // Synchronous Direct Touch Execution for Mobile Browsers
        document.getElementById('btn-radio1').onclick = function() {
            songNameEl.innerText = 'सदाबहार हिंदी रेडियो';
            artistNameEl.innerText = 'Live Retro Hits';
            setStatus('Connecting...');
            audio.src = URL_RADIO_1;
            audio.play();
        };

        document.getElementById('btn-radio2').onclick = function() {
            songNameEl.innerText = 'क्लासिक 80s-90s';
            artistNameEl.innerText = 'Golden Era Hits';
            setStatus('Connecting...');
            audio.src = URL_RADIO_2;
            audio.play();
        };

        playBtn.onclick = function() {
            if (!audio.src) {
                document.getElementById('btn-radio1').click();
                return;
            }
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        };

        audio.ontimeupdate = function() {
            if (audio.duration && !isNaN(audio.duration) && audio.duration !== Infinity) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                let cM = Math.floor(audio.currentTime / 60), cS = Math.floor(audio.currentTime % 60);
                let dM = Math.floor(audio.duration / 60), dS = Math.floor(audio.duration % 60);
                currentTimeEl.innerText = `${cM}:${cS < 10 ? '0' + cS : cS}`;
                durationEl.innerText = `${dM}:${dS < 10 ? '0' + dS : dS}`;
            } else {
                currentTimeEl.innerText = "LIVE";
                durationEl.innerText = "STREAM";
            }
        };

        progress.oninput = function() {
            if (audio.duration && !isNaN(audio.duration)) audio.currentTime = (progress.value / 100) * audio.duration;
        };

        function loadSong(index) {
            if (typeof myPlaylist === 'undefined' || !myPlaylist[index]) return;
            const song = myPlaylist[index];
            songNameEl.innerText = song.name;
            artistNameEl.innerText = song.artist;
            audio.src = song.audio;
            renderPlaylist();
        }

        nextBtn.onclick = function() {
            if (typeof myPlaylist === 'undefined') return;
            currentSongIndex = isShuffle ? Math.floor(Math.random() * myPlaylist.length) : (currentSongIndex + 1) % myPlaylist.length;
            loadSong(currentSongIndex);
            audio.play();
        };

        prevBtn.onclick = function() {
            if (typeof myPlaylist === 'undefined') return;
            currentSongIndex = (currentSongIndex - 1 + myPlaylist.length) % myPlaylist.length;
            loadSong(currentSongIndex);
            audio.play();
        };

        shuffleBtn.onclick = function() {
            isShuffle = !isShuffle;
            shuffleBtn.style.opacity = isShuffle ? "1" : "0.5";
        };

        audio.onended = function() { nextBtn.click(); };

        const playlistModal = document.getElementById('playlist-modal'), 
              playlistBtn = document.getElementById('playlist-btn'), 
              closePlaylist = document.getElementById('close-playlist'), 
              songListContainer = document.getElementById('song-list'), 
              searchBar = document.getElementById('search-bar');

        playlistBtn.onclick = function() { playlistModal.style.display = 'flex'; };
        closePlaylist.onclick = function() { playlistModal.style.display = 'none'; };

        function renderPlaylist(filter = '') {
            songListContainer.innerHTML = '';
            if (typeof myPlaylist === 'undefined') {
                songListContainer.innerHTML = '<p style="color:#aaa; font-size:12px;">data.js not loaded</p>';
                return;
            }
            myPlaylist.forEach((song, index) => {
                if (song.name.toLowerCase().includes(filter.toLowerCase())) {
                    const item = document.createElement('div');
                    item.className = `song-item ${index === currentSongIndex ? 'active' : ''}`;
                    item.innerHTML = `<div><strong>${song.name}</strong><br><small>${song.artist}</small></div>`;
                    item.onclick = function() {
                        currentSongIndex = index;
                        loadSong(currentSongIndex);
                        playlistModal.style.display = 'none';
                        audio.play();
                    };
                    songListContainer.appendChild(item);
                }
            });
        }
        searchBar.oninput = function(e) { renderPlaylist(e.target.value); };

        window.onload = function() { 
            if (typeof myPlaylist !== 'undefined' && myPlaylist.length > 0) {
                loadSong(0);
            }
        };
    </script>
</body>
</html>
