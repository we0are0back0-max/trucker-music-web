<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trucker Music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            width: 100%; height: 100%; overflow: hidden; position: fixed;
            background-image: url('https://cdn.jsdelivr.net/gh/we0are0back0-max/trucker-music-web@main/64e285ad54fd721bc64723753da45c98.jpg');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1a1a1a;
        }
        body::before { content: ''; position: absolute; width: 100%; height: 100%; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); z-index: 1; }
        
        /* Top Info Bar */
        .info-bar { position: absolute; top: 15px; width: 90%; display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; z-index: 3; letter-spacing: 0.5px; }

        .player-container { width: 210px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
        .cover-art { width: 210px; height: 210px; object-fit: cover; border-radius: 2px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-bottom: 15px; }
        .song-title { font-size: 11px; font-weight: 600; margin-bottom: 20px; text-align: center; width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-bar { width: 100%; height: 2px; background: #000; margin-bottom: 25px; accent-color: #000; cursor: pointer; }
        .controls { display: flex; justify-content: space-between; width: 100%; align-items: center; }
        .play-btn { width: 45px; height: 45px; border-radius: 50%; border: 1.5px solid #000; cursor: pointer; background: transparent; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .nav-btn { background: none; border: none; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

    <!-- Top Info Bar -->
    <div class="info-bar">
        <div id="clock">00:00</div>
        <div id="live-users">Live: 750</div>
    </div>

    <div class="player-container">
        <img id="cover" class="cover-art" src="">
        <div class="song-title" id="song-name">Loading...</div>
        <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
        <audio id="audio"></audio>
        
        <div class="controls">
            <button class="nav-btn" onclick="prevSong()">⏮</button>
            <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="nav-btn" onclick="nextSong()">⏭</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // Clock Logic
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Live User Logic (700-800)
        setInterval(() => {
            const randomCount = Math.floor(Math.random() * (800 - 700 + 1)) + 700;
            document.getElementById('live-users').innerText = "Live: " + randomCount;
        }, 3000);

        // Player Logic
        const audio = document.getElementById('audio');
        const songName = document.getElementById('song-name');
        const cover = document.getElementById('cover');
        const playBtn = document.getElementById('play-btn');
        let index = 0;

        function loadSong(i) {
            songName.innerText = myPlaylist[i].name;
            audio.src = myPlaylist[i].audio;
            cover.src = myPlaylist[i].cover;
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
            }
        }

        function nextSong() { index = (index + 1) % myPlaylist.length; loadSong(index); audio.play(); playBtn.innerText = "⏸"; }
        function prevSong() { index = (index - 1 + myPlaylist.length) % myPlaylist.length; loadSong(index); audio.play(); playBtn.innerText = "⏸"; }

        loadSong(index);
    </script>
</body>
</html>
