<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trucker Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; overflow: hidden; position: fixed;
            background-color: #000;
            background-image: url('https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        /* Top Bar Info */
        .info-bar {
            position: absolute; top: 15px; width: 90%; left: 5%;
            display: flex; justify-content: space-between;
            font-size: 11px; font-weight: 700; z-index: 10; opacity: 0.9;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }

        /* Bottom Fixed Player Container */
        .player-wrapper {
            position: absolute;
            bottom: 30px; /* Navigation bar ke thoda upar */
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 420px;
            z-index: 10;
        }

        /* Sharp White Border Dark Black Card */
        .player-card {
            background: #0a0a0a;
            border: 1.5px solid #ffffff;
            border-radius: 24px;
            padding: 16px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        /* Top Section: CD Art + Song Info */
        .top-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        /* Rotating CD Disc */
        .cd-art {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: spin 8s linear infinite;
            animation-play-state: paused; /* Play hone par hi ghumegi */
        }

        .cd-art.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .song-details {
            flex: 1;
            overflow: hidden;
        }

        .song-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .artist-name {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Timeline / Progress Bar */
        .progress-container {
            width: 100%;
            margin-bottom: 14px;
        }

        .progress-bar {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 3px; background: rgba(255, 255, 255, 0.2);
            outline: none; cursor: pointer; border-radius: 2px;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 10px; height: 10px; border-radius: 50%;
            background: #fff; cursor: pointer;
        }

        .time-stamps {
            display: flex; justify-content: flex-start;
            font-size: 12px; font-weight: 600; margin-top: 6px; color: #b3b3b3;
        }

        /* Control Buttons Layout */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer; color: #fff;
            display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.85;
            padding: 8px;
        }

        .icon-btn.active { color: #1db954; opacity: 1; } /* Active shuffle indicator */

        /* Center Big Play Button */
        .play-pause-circle {
            width: 48px; height: 48px; border-radius: 50%;
            background: #fff; color: #000; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; outline: none; box-shadow: 0 4px 12px rgba(255,255,255,0.2);
        }

        /* Playlist Modal / Pop-Up */
        .playlist-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 100; display: none; flex-direction: column; padding: 20px;
        }

        .playlist-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
        }

        .search-input {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 14px; outline: none;
            margin-bottom: 15px;
        }

        .song-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
        }

        .song-item {
            padding: 10px; background: #181818; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }

        .song-item.active { border-left: 4px solid #fff; background: #222; }

        svg { fill: currentColor; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div id="clock">00:00</div>
        <div id="live-users">Live: 750</div>
    </div>

    <!-- Music Player Card Box -->
    <div class="player-wrapper">
        <div class="player-card">
            <div class="top-section">
                <!-- Rotating CD (cd.jpg from repo) -->
                <img id="cd-disc" class="cd-art" src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'" alt="CD">
                <div class="song-details">
                    <div class="song-title" id="song-name">Loading Song...</div>
                    <div class="artist-name" id="artist-name">Artist Name</div>
                </div>
            </div>

            <audio id="audio"></audio>

            <div class="progress-container">
                <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
                <div class="time-stamps">
                    <span id="current-time">0:00</span>&nbsp;/&nbsp;<span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls-row">
                <!-- Shuffle / Random Mode Button (Left) -->
                <button class="icon-btn" id="shuffle-btn" title="Shuffle / Random Song">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
                </button>

                <!-- Previous -->
                <button class="icon-btn" id="prev">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>

                <!-- Center Big Play Button -->
                <button class="play-pause-circle" id="play-btn">
                    <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>

                <!-- Next -->
                <button class="icon-btn" id="next">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>

                <!-- Playlist Pop Up Trigger (Right) -->
                <button class="icon-btn" id="playlist-btn" title="Open Playlist">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h11v2H4z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Playlist Modal Pop-up -->
    <div class="playlist-modal" id="playlist-modal">
        <div class="playlist-header">
            <h3>Playlist</h3>
            <button class="icon-btn" id="close-playlist" style="font-size: 20px;">✕</button>
        </div>
        <input type="text" id="search-bar" class="search-input" placeholder="Search song or artist...">
        <div class="song-list" id="song-list"></div>
    </div>

    <script src="data.js"></script>
    <script>
        // Clock & Live Users
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();

        setInterval(() => {
            document.getElementById('live-users').innerText = "Live: " + (Math.floor(Math.random() * 101) + 700);
        }, 3000);

        // Player Controls Logic
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const nextBtn = document.getElementById('next');
        const prevBtn = document.getElementById('prev');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const songNameEl = document.getElementById('song-name');
        const artistNameEl = document.getElementById('artist-name');
        const cdDisc = document.getElementById('cd-disc');

        let currentSongIndex = 0; 
        let isPlaying = false;
        let isShuffle = false;

        function loadSong(index) {
            const currentSong = myPlaylist[index];
            songNameEl.innerText = currentSong.name || "Unknown Track";
            artistNameEl.innerText = currentSong.artist || "Unknown Artist";
            audio.src = currentSong.audio;
            audio.load();
            renderPlaylist();
        }

        function togglePlay() {
            if (isPlaying) {
                audio.pause(); 
                playIcon.style.display = 'block'; 
                pauseIcon.style.display = 'none';
                cdDisc.classList.remove('playing');
            } else {
                audio.play(); 
                playIcon.style.display = 'none'; 
                pauseIcon.style.display = 'block';
                cdDisc.classList.add('playing');
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);

        nextBtn.addEventListener('click', () => {
            if (isShuffle) {
                currentSongIndex = Math.floor(Math.random() * myPlaylist.length);
            } else {
                currentSongIndex = (currentSongIndex + 1) % myPlaylist.length;
            }
            loadSong(currentSongIndex); 
            if (isPlaying) { audio.play(); cdDisc.classList.add('playing'); }
        });

        prevBtn.addEventListener('click', () => {
            currentSongIndex = (currentSongIndex - 1 + myPlaylist.length) % myPlaylist.length;
            loadSong(currentSongIndex); 
            if (isPlaying) { audio.play(); cdDisc.classList.add('playing'); }
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                let cM = Math.floor(audio.currentTime / 60), cS = Math.floor(audio.currentTime % 60);
                let dM = Math.floor(audio.duration / 60), dS = Math.floor(audio.duration % 60);
                currentTimeEl.innerText = `${cM}:${cS < 10 ? '0'+cS : cS}`;
                durationEl.innerText = `${dM}:${dS < 10 ? '0'+dS : dS}`;
            }
        });

        progress.addEventListener('input', () => { audio.currentTime = (progress.value / 100) * audio.duration; });
        audio.addEventListener('ended', () => nextBtn.click());

        // Playlist & Search Functionality
        const playlistModal = document.getElementById('playlist-modal');
        const playlistBtn = document.getElementById('playlist-btn');
        const closePlaylist = document.getElementById('close-playlist');
        const songListContainer = document.getElementById('song-list');
        const searchBar = document.getElementById('search-bar');

        playlistBtn.addEventListener('click', () => playlistModal.style.display = 'flex');
        closePlaylist.addEventListener('click', () => playlistModal.style.display = 'none');

        function renderPlaylist(filter = '') {
            songListContainer.innerHTML = '';
            myPlaylist.forEach((song, index) => {
                if (song.name.toLowerCase().includes(filter.toLowerCase())) {
                    const item = document.createElement('div');
                    item.className = `song-item ${index === currentSongIndex ? 'active' : ''}`;
                    item.innerHTML = `<div><strong>${song.name}</strong><br><small style="color:#aaa">${song.artist || ''}</small></div>`;
                    item.onclick = () => {
                        currentSongIndex = index;
                        loadSong(currentSongIndex);
                        playlistModal.style.display = 'none';
                        if (!isPlaying) togglePlay();
                        else audio.play();
                    };
                    songListContainer.appendChild(item);
                }
            });
        }

        searchBar.addEventListener('input', (e) => renderPlaylist(e.target.value));

        // Initial Load
        if (typeof myPlaylist !== 'undefined' && myPlaylist.length > 0) {
            loadSong(currentSongIndex);
        }
    </script>
</body>
</html>
