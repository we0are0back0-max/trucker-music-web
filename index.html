<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Trucker Music</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: sans-serif; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; background-image: url('https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'); background-size: cover; background-position: center; }
        
        .player-wrapper { width: 92%; max-width: 420px; z-index: 10; }
        .player-card { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; padding: 15px; }
        
        /* Visualizer */
        canvas { width: 100%; height: 40px; margin-bottom: 10px; display: block; }
        
        .top-section { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .cd-art { width: 50px; height: 50px; border-radius: 50%; animation: spin 8s linear infinite; animation-play-state: paused; }
        .cd-art.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .progress-bar { width: 100%; height: 3px; accent-color: #fff; cursor: pointer; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .vol-slider { width: 60px; height: 3px; }
    </style>
</head>
<body>

    <div class="player-wrapper">
        <div class="player-card">
            <canvas id="visualizer"></canvas>
            <div class="top-section">
                <img id="cd-disc" class="cd-art" src="https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/cd.jpg" onerror="this.src='https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'" alt="CD">
                <div class="song-details">
                    <div id="song-name" style="font-size: 14px; font-weight: bold;">Loading...</div>
                </div>
            </div>
            <audio id="audio"></audio>
            <input type="range" id="progress" class="progress-bar" value="0">
            <div class="controls-row">
                <input type="range" id="volume" class="vol-slider" min="0" max="1" step="0.1" value="1">
                <button id="play-btn" style="background:#fff; border-radius:50%; width:40px; height:40px; border:none; cursor:pointer;">Play</button>
                <button id="next-btn" style="background:none; color:#fff; border:none; cursor:pointer;">Next</button>
            </div>
        </div>
    </div>

    <!-- PWA Install Popup -->
    <div id="install-popup" style="display:none; position:fixed; bottom:20px; background:#fff; color:#000; padding:15px; border-radius:10px; z-index:999;">
        Install App for better experience! <button onclick="installApp()">Install</button>
    </div>

    <script src="data.js"></script>
    <script>
        const audio = document.getElementById('audio'), cd = document.getElementById('cd-disc'), playBtn = document.getElementById('play-btn');
        let currentSongIndex = localStorage.getItem('lastIndex') || 0;
        
        // Load Memory
        window.onload = () => {
            loadSong(currentSongIndex);
            // PWA Popup logic
            if (!localStorage.getItem('isInstalledPopUpShown')) {
                document.getElementById('install-popup').style.display = 'block';
                localStorage.setItem('isInstalledPopUpShown', 'true');
            }
        };

        function loadSong(index) {
            const song = myPlaylist[index];
            audio.src = song.audio;
            document.getElementById('song-name').innerText = song.name;
            audio.currentTime = localStorage.getItem('lastTime') || 0;
            currentSongIndex = index;
            localStorage.setItem('lastIndex', index);
        }

        audio.ontimeupdate = () => {
            localStorage.setItem('lastTime', audio.currentTime);
            document.getElementById('progress').value = (audio.currentTime/audio.duration)*100;
        };

        playBtn.onclick = () => {
            if(audio.paused) { audio.play(); cd.classList.add('playing'); setupVisualizer(); }
            else { audio.pause(); cd.classList.remove('playing'); }
        };

        // Visualizer
        let audioCtx, analyser;
        function setupVisualizer() {
            if(!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                let source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                draw();
            }
        }
        function draw() {
            requestAnimationFrame(draw);
            let canvas = document.getElementById('visualizer');
            let ctx = canvas.getContext('2d');
            let data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            for(let i=0; i<20; i++) { ctx.fillRect(i*10, 40-data[i]/5, 5, data[i]/5); }
        }

        // Volume
        document.getElementById('volume').oninput = (e) => audio.volume = e.target.value;

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
        function installApp() { if(deferredPrompt) deferredPrompt.prompt(); }
    </script>
</body>
</html>
