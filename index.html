<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trucker Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; overflow: hidden; position: fixed;
            background-color: #111;
            /* PERMANENT LINK: Ab jab bhi gallery se nayi photo bg.jpg naam se upload karoge, sabhi users ko wahi dikhegi */
            background-image: url('https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            display: flex; justify-content: center; align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
        }

        /* Glassmorphism Blur Overlay */
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px); z-index: 1;
        }

        .info-bar {
            position: absolute; top: 20px; width: 85%; display: flex; justify-content: space-between;
            font-size: 11px; font-weight: 600; z-index: 3; opacity: 0.8; letter-spacing: 1px;
        }

        /* Modern Card UI */
        .player-container {
            width: 240px; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 18px; border-radius: 16px;
            display: flex; flex-direction: column; align-items: center;
            position: relative; z-index: 2; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .cover-art {
            width: 204px; height: 204px; object-fit: cover;
            border-radius: 10px; margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .song-title {
            font-size: 13px; font-weight: 600; margin-bottom: 12px;
            text-align: center; width: 100%; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; color: #fff;
        }

        .progress-wrapper { width: 100%; margin-bottom: 15px; }

        .progress-bar {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 2px; background: rgba(255, 255, 255, 0.2);
            outline: none; cursor: pointer; border-radius: 2px;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 8px; height: 8px; border-radius: 50%;
            background: #fff; cursor: pointer;
        }

        .time-stamps {
            display: flex; justify-content: space-between;
            font-size: 9px; margin-top: 6px; color: rgba(255, 255, 255, 0.6);
        }

        .controls-row {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer; color: #fff;
            display: flex; align-items: center; justify-content: center; outline: none; opacity: 0.8;
        }

        .icon-btn:hover { opacity: 1; }

        .play-pause-circle {
            width: 42px; height: 42px; border-radius: 50%;
            background: #fff; color: #000; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; outline: none; transition: transform 0.1s ease;
        }

        .play-pause-circle:active { transform: scale(0.95); }
        svg { fill: currentColor; }
    </style>
</head>
<body>

    <div class="info-bar">
        <div id="clock">00:00</div>
        <div id="live-users">Live: 750</div>
    </div>

    <div class="player-container">
        <img id="cover" class="cover-art" src="" alt="Cover">
        <div class="song-title" id="song-name">Loading...</div>

        <audio id="audio"></audio>

        <div class="progress-wrapper">
            <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100">
            <div class="time-stamps">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="controls-row">
            <button class="icon-btn" id="shuffle-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            </button>
            <button class="icon-btn" id="prev">
                <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
            </button>
            <button class="play-pause-circle" id="play-btn">
                <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" width="14" height="14" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="icon-btn" id="next">
                <svg width="14" height="14" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="icon-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></svg>
            </button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // Clock & Live Users
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();

        setInterval(() => {
            document.getElementById('live-users').innerText = "Live: " + (Math.floor(Math.random() * 101) + 700);
        }, 3000);

        // Player Logic
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progress = document.getElementById('progress');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const nextBtn = document.getElementById('next');
        const prevBtn = document.getElementById('prev');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const songNameEl = document.getElementById('song-name');
        const coverEl = document.getElementById('cover');

        let currentSongIndex = 0; let isPlaying = false;

        function loadSong(index) {
            const currentSong = myPlaylist[index];
            songNameEl.innerText = currentSong.name;
            coverEl.src = currentSong.cover;
            audio.src = currentSong.audio;
            audio.load();
        }
        loadSong(currentSongIndex);

        function togglePlay() {
            if (isPlaying) {
                audio.pause(); playIcon.style.display = 'block'; pauseIcon.style.display = 'none';
            } else {
                audio.play(); playIcon.style.display = 'none'; pauseIcon.style.display = 'block';
            }
            isPlaying = !isPlaying;
        }

        playBtn.addEventListener('click', togglePlay);
        nextBtn.addEventListener('click', () => { currentSongIndex = (currentSongIndex + 1) % myPlaylist.length; loadSong(currentSongIndex); if (isPlaying) audio.play(); });
        prevBtn.addEventListener('click', () => { currentSongIndex = (currentSongIndex - 1 + myPlaylist.length) % myPlaylist.length; loadSong(currentSongIndex); if (isPlaying) audio.play(); });

        shuffleBtn.addEventListener('click', () => {
            currentSongIndex = Math.floor(Math.random() * myPlaylist.length);
            loadSong(currentSongIndex); if (isPlaying) audio.play();
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                progress.value = (audio.currentTime / audio.duration) * 100;
                let cM = Math.floor(audio.currentTime / 60), cS = Math.floor(audio.currentTime % 60);
                let dM = Math.floor(audio.duration / 60), dS = Math.floor(audio.duration % 60);
                currentTimeEl.innerText = `${cM}:${cS < 10 ? '0'+cS : cS}`;
                durationEl.innerText = `${dM}:${dS < 10 ? '0'+dS : dS}`;
            }
        });

        progress.addEventListener('input', () => { audio.currentTime = (progress.value / 100) * audio.duration; });
        audio.addEventListener('ended', () => nextBtn.click());
    </script>
</body>
</html>
