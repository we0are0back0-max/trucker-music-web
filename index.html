<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truck Wala</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; background-image: url('https://raw.githubusercontent.com/we0are0back0-max/trucker-music-web/main/bg.jpg'); background-size: cover; font-family: sans-serif; color: #fff; }

        .quote-container { position: absolute; bottom: 250px; width: 90%; left: 5%; text-align: center; z-index: 10; font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }

        /* Right Side App Install (Sharp Box) */
        .right-actions-container { position: absolute; top: 120px; right: 15px; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .app-install-box { display: flex; flex-direction: column; align-items: center; width: 80px; cursor: pointer; }
        .sharp-box { width: 60px; height: 60px; background-color: #fff; border: 2px solid #000; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #000; text-align: center; margin-bottom: 5px; }
        .install-text { background: #fff; color: #000; padding: 4px; border: 2px solid #000; font-size: 9px; text-align: center; font-weight: 800; width: 100%; }

        /* Player */
        .player-wrapper { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 420px; z-index: 10; }
        .player-card { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 20px; padding: 15px; }
    </style>
</head>
<body>

    <div id="quote-container" class="quote-container">Loading...</div>

    <!-- App Install -->
    <div class="right-actions-container">
        <div class="app-install-box" id="install-btn">
            <div class="sharp-box">ट्रक<br>वाला</div>
            <div class="install-text">INSTALL</div>
        </div>
    </div>

    <!-- Player -->
    <div class="player-wrapper">
        <div class="player-card">
            <div id="song-name" style="font-weight:bold; margin-bottom:5px;">Select a Song</div>
            <audio id="audio" controls style="width:100%;"></audio>
        </div>
    </div>

    <script>
        // 1. FIXED PLAYLIST (यहीं गाने डाल दो)
        const myPlaylist = [
            { name: "Desi Truck Beat", artist: "Driver", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { name: "Highway King", artist: "Music", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];

        // 2. PLAYER FIX
        const audio = document.getElementById('audio');
        const songName = document.getElementById('song-name');
        
        function initPlayer() {
            if(myPlaylist.length > 0) {
                songName.innerText = myPlaylist[0].name;
                audio.src = myPlaylist[0].audio;
            }
        }
        initPlayer();

        // 3. INSTALL LOGIC FIX
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.getElementById('install-btn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
            } else {
                alert("Installation: Apni browser setting mein jaakar 'Add to Home Screen' par click karein.");
            }
        });

        // Quotes
        const quotes = ["धीरे चल प्यारे, जीवन अनमोल है।", "सावधानी हटी, सब्जी-पूड़ी बंटी।", "मैं भी बड़ा होकर ट्रक बनूंगा।"];
        let qIndex = 0;
        function updateQuote() { document.getElementById('quote-container').innerText = quotes[qIndex]; qIndex = (qIndex + 1) % quotes.length; }
        setInterval(updateQuote, 5000); updateQuote();
    </script>
</body>
</html>
