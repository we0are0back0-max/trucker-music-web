<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trucker Music Player</title>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; font-family: sans-serif; }
        .player-container { width: 250px; text-align: center; color: white; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; }
        .cover-art { width: 200px; height: 200px; border-radius: 10px; object-fit: cover; }
        h2 { font-size: 16px; margin: 15px 0; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="player-container">
        <img id="cover" class="cover-art" src="" alt="Cover">
        <h2 id="song-name">Song Name</h2>
        <audio id="audio"></audio>
        <div class="controls">
            <button onclick="prevSong()">⏮️</button>
            <button id="play-btn" onclick="togglePlay()">⏯️</button>
            <button onclick="nextSong()">⏭️</button>
        </div>
    </div>

    <!-- YAHAN DATA.JS CONNECT KIYA HAI -->
    <script src="data.js"></script>

    <script>
        const audio = document.getElementById('audio');
        const songName = document.getElementById('song-name');
        const cover = document.getElementById('cover');
        let index = 0;

        function loadSong(i) {
            songName.innerText = myPlaylist[i].name;
            audio.src = myPlaylist[i].audio;
            cover.src = myPlaylist[i].cover;
        }

        function togglePlay() {
            audio.paused ? audio.play() : audio.pause();
        }

        function nextSong() {
            index = (index + 1) % myPlaylist.length;
            loadSong(index);
            audio.play();
        }

        function prevSong() {
            index = (index - 1 + myPlaylist.length) % myPlaylist.length;
            loadSong(index);
            audio.play();
        }

        loadSong(index);
    </script>
</body>
</html>
